<!DOCTYPE html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1544px;height:500px;font-family:Inter,system-ui,sans-serif;position:relative;overflow:hidden;
 background:#0b1220;}
.bg{position:absolute;inset:0;
 background:
  radial-gradient(1100px 700px at 100% 0%, #102f3e 0%, rgba(16,47,62,0) 60%),
  radial-gradient(1000px 800px at 0% 100%, #13254f 0%, rgba(19,37,79,0) 62%),
  linear-gradient(135deg,#0b1220 0%,#0f172a 50%,#111c32 100%);}
.grid{position:absolute;inset:0;opacity:.16;
 background-image:linear-gradient(#2dd4bf22 1px,transparent 1px),linear-gradient(90deg,#2dd4bf22 1px,transparent 1px);
 background-size:56px 56px;
 -webkit-mask-image:linear-gradient(90deg,rgba(0,0,0,.15),rgba(0,0,0,.85));}
.wrap{position:relative;height:100%;display:flex;align-items:center;padding:0 96px;gap:56px}
.icon{width:180px;height:180px;border-radius:42px;flex:0 0 auto;
 box-shadow:0 22px 54px rgba(0,0,0,.5)}
h1{font-size:104px;font-weight:800;line-height:1;letter-spacing:-3px;color:#fff;margin-bottom:20px}
h1 span{color:#2dd4bf}
p{font-size:40px;font-weight:500;color:#b6c2d4;letter-spacing:-.4px;margin-bottom:30px}
.chips{display:flex;gap:20px}
.chip{background:#1c2538;border:1px solid #2b3852;border-radius:14px;padding:12px 26px;
 font-size:27px;font-weight:500;color:#dbe3ef}
.chip b{color:#2dd4bf;font-weight:700}
.chip.mono{font-family:ui-monospace,"Cascadia Mono",Menlo,monospace;color:#2dd4bf;font-weight:600}
</style></head><body>
